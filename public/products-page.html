</style><style id="transparent-nav-controls">

</style><style id="nesma-category-slider">

</div><header class="shop-head shop-wrap"><span class="shop-kicker">ATHEER COLLECTION</span><h1>منتجات أثير</h1><p>اختاري القسم واستكشفي المنتجات المتاحة.</p></header><main class="shop-wrap"><div id="categoryTabs" class="shop-nav-inner" style="background:transparent;padding:0 0 10px"></div><section id="productsGrid" class="shop-grid"></section></main><script src="shop.js"></script><script>document.addEventListener('nesma:data-ready',e=>{const s=e.detail,c=document.getElementById('categoryTabs');const cats=s.categories||[];const smart=[['all','الكل'],['abayas','عبايات'],['latest','وصل حديثاً'],['best','الأكثر مبيعاً'],['offers','العروض'],['halfmoon','نصف القمر'],['sets','أطقم']];c.innerHTML=smart.map((x,i)=>`<a href="?filter=${x[0]}" class="${i===0?'active':''}" data-smart="${x[0]}">${x[1]}</a>`).join('')+cats.map(x=>`<a href="?category=${encodeURIComponent(x.slug)}" data-cat="${String(x.slug).replace(/"/g,'&quot;')}">${String(x.name).replace(/</g,'&lt;')}</a>`).join('');const params=new URLSearchParams(location.search);const wanted=params.get('category')||'';const smartWanted=params.get('filter')||'all';const q=params.get('q')||'';const text=p=>SutoolShop.productSearchText(p);const smartItems=type=>{let a=[...s.products];if(type==='abayas')a=a.filter(p=>text(p).includes('عبايات')||text(p).includes('عبايه'));if(type==='latest')a=a.filter(p=>text(p).includes('جديد')||text(p).includes('وصل حديثا')||text(p).includes('وصل حديث'));if(type==='best')a=a.filter(p=>text(p).includes('الاكثر مبيعا')||text(p).includes('bestseller')||text(p).includes('best seller')).sort((a,b)=>Number(b.reviews||0)-Number(a.reviews||0));if(type==='offers')a=a.filter(p=>Number(p.old_price||0)>Number(p.price||0)||text(p).includes('عرض'));if(type==='halfmoon')a=a.filter(p=>text(p).includes('نصف القمر'));if(type==='sets')a=a.filter(p=>text(p).includes('اطقم')||text(p).includes('طقم'));return a};const render=(mode,query=q)=>{let items=mode.startsWith('category:')?s.products.filter(p=>(p.category_slugs||[]).includes(mode.slice(9))):smartItems(mode);if(query)items=items.filter(p=>SutoolShop.matchesProduct(p,query));SutoolShop.renderGrid('productsGrid',items);const st=document.getElementById('searchStatus');if(st)st.textContent=query?`${items.length} منتج مطابق للبحث`:items.length?`${items.length} منتج`:'لا توجد منتجات مطابقة لهذا القسم'};let initial=wanted?(c.querySelector(`[data-cat="${CSS.escape(wanted)}"]`)||c.querySelector('[data-smart="all"]')):(c.querySelector(`[data-smart="${CSS.escape(smartWanted)}"]`)||c.querySelector('[data-smart="all"]'));c.querySelectorAll('a').forEach(z=>z.classList.remove('active'));initial.classList.add('active');render(initial.dataset.smart?initial.dataset.smart:`category:${initial.dataset.cat}`,q);c.querySelectorAll('[data-smart]').forEach(a=>a.onclick=x=>{x.preventDefault();const next=new URL(location.href);next.searchParams.set('filter',a.dataset.smart);next.searchParams.delete('category');if(q)next.searchParams.set('q',q);else next.searchParams.delete('q');history.pushState({},'',next);c.querySelectorAll('a').forEach(z=>z.classList.remove('active'));a.classList.add('active');render(a.dataset.smart,q)});c.querySelectorAll('[data-cat]').forEach(a=>a.onclick=x=>{x.preventDefault();const next=new URL(location.href);next.searchParams.set('category',a.dataset.cat);next.searchParams.delete('filter');if(q)next.searchParams.set('q',q);else next.searchParams.delete('q');history.pushState({},'',next);c.querySelectorAll('a').forEach(z=>z.classList.remove('active'));a.classList.add('active');render(`category:${a.dataset.cat}`,q)});window.addEventListener('popstate',()=>location.reload())});</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="store-atheer.js"></script><script src="notifications.js"></script></body></html>
