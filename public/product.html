<style id="nesma-modern-nav-style">
:root { --gold: #d4af37; --gold-light: #f3d77a; --gold-dark: #9b720c; --nav-height: 62px; }
.nesma-modern-navbar { width:100%; min-height:82px; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; direction:ltr; background:linear-gradient(135deg,#9b720c 0%,#d4af37 48%,#f3d477 100%); border-bottom-left-radius:38px; border-bottom-right-radius:38px; box-shadow:0 4px 12px rgba(99,70,0,.18); position:relative; z-index:1000; }
.nesma-modern-navbar .nav-left,.nesma-modern-navbar .nav-right { display:flex; align-items:center; }
.nesma-modern-navbar .nav-left { gap:16px; }
.nesma-modern-navbar .nav-left button,.nesma-modern-navbar .modern-menu-button { border:0; padding:0; background:transparent; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.nesma-modern-navbar .nav-cart-button { position:relative; width:28px; height:34px; font-size:22px; }
.nesma-modern-navbar .nav-cart-button #cartCount { position:absolute; top:-5px; right:-8px; min-width:17px; height:17px; padding:0 4px; display:grid; place-items:center; border-radius:50%; background:#17130b; color:#fff; font:700 10px/1 Arial,sans-serif; }
.nesma-modern-navbar .header-search-button { width:30px; height:34px; font-size:21px; }
.nesma-modern-navbar .currency-toggle { display:flex; align-items:center; gap:3px; color:#fff; font:700 17px Arial,sans-serif; cursor:pointer; }
.nesma-modern-navbar .currency-icon { font-size:21px; line-height:1; }
.nesma-modern-navbar #currencyShort { font-size:17px; white-space:nowrap; }
.nesma-modern-navbar .currency-hidden { display:none; }
.nesma-modern-navbar .nav-right { gap:9px; direction:ltr; }
.nesma-modern-navbar .modern-logo { display:flex; align-items:center; color:#fff; white-space:nowrap; text-decoration:none; }
.nesma-modern-navbar .site-logo { width:104px; height:52px; object-fit:contain; display:block; border-radius:10px; }
.nesma-modern-navbar .logo-text { font-family:'Dancing Script',cursive; font-size:48px; font-weight:700; line-height:.9; }
.nesma-modern-navbar .modern-menu-button { margin-left:2px; font-size:22px; width:30px; height:48px; }
.nesma-modern-navbar .modern-nav-collapse { width:100%; }
.nesma-modern-navbar .modern-nav-collapse .nav-link { color:#fff; }
@media (max-width:768px) { .nesma-modern-navbar { min-height:70px; padding:10px 12px; border-bottom-left-radius:30px; border-bottom-right-radius:30px; } .nesma-modern-navbar .nav-left { gap:10px; } .nesma-modern-navbar .currency-toggle { font-size:14px; } .nesma-modern-navbar .currency-icon { font-size:18px; } .nesma-modern-navbar #currencyShort { font-size:14px; } .nesma-modern-navbar .nav-right { gap:6px; } .nesma-modern-navbar .logo-text { font-size:40px; } .nesma-modern-navbar .modern-menu-button { height:40px; } .nesma-modern-navbar .modern-nav-collapse { margin-top:10px; } }
@media (max-width:360px) { .nesma-modern-navbar { min-height:64px; padding:8px 10px; } .nesma-modern-navbar .nav-left { gap:8px; } .nesma-modern-navbar .currency-toggle { font-size:12px; } .nesma-modern-navbar .currency-icon { font-size:16px; } .nesma-modern-navbar #currencyShort { font-size:12px; } .nesma-modern-navbar .logo-text { font-size:35px; } }
</style>
<style id="transparent-nav-controls">
#navmenu, #navmenu.navbar-collapse, #currencyToggle, #currencySelect { background:transparent !important; }
#currencyToggle:hover, #currencyToggle:focus, #currencyToggle:focus-visible, #currencyToggle:active { background:transparent !important; }
#currencyToggle { border-color:transparent !important; box-shadow:none !important; }

<style>
:root{--gold:#d5b56e;--gold2:#b18b4c;--black:#090909;--muted:#8f8f8f;--line:#2b271e}
body.product-page{background:#050505;color:#fff;font-family:Tajawal,Arial,sans-serif}
.product-nav{background:#080808;border-bottom:1px solid #2b2519;padding:12px 0;position:sticky;top:0;z-index:20}
.product-nav .shop-nav-inner{justify-content:space-between;align-items:center}.product-nav a{color:#eee}.product-nav .back{color:var(--gold);border-color:#514326}
.product-shell{padding:28px 0 60px}.product-layout{display:grid;grid-template-columns:1.08fr .92fr;gap:28px;align-items:start}
.gallery{background:#0d0d0d;border:1px solid #2c271d;border-radius:0 34px 34px 34px;padding:14px;position:sticky;top:80px}.main-image{aspect-ratio:.86;border-radius:0 28px 28px 28px;overflow:hidden;background:#111}.main-image img{width:100%;height:100%;object-fit:cover;display:block}.thumbs{display:flex;gap:9px;overflow:auto;margin-top:11px;padding-bottom:3px}.thumb{width:74px;height:88px;flex:0 0 auto;border:1px solid #443922;border-radius:12px;padding:0;overflow:hidden;background:#111;cursor:pointer}.thumb.active{border-color:var(--gold);box-shadow:0 0 0 2px #d5b56e33}.thumb img{width:100%;height:100%;object-fit:cover}
.info{background:#0d0d0d;border:1px solid #2c271d;border-radius:34px 0 34px 34px;padding:28px}.kicker{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.15em}.title{font-size:clamp(28px,4vw,46px);margin:7px 0 8px;line-height:1.25}.category{color:#aaa;font-size:14px}.rating{color:var(--gold);margin:14px 0}.description{color:#c6c6c6;line-height:2;font-size:15px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.badge{border:1px solid var(--gold2);color:var(--gold);border-radius:999px;padding:6px 11px;font-size:12px}.price-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:20px 0}.price{font-size:29px;font-weight:800;color:var(--gold)}.old{text-decoration:line-through;color:#777}.discount{color:#e6d08e;font-size:12px}
.option-section{border-top:1px solid #2b271e;padding-top:17px;margin-top:18px}.option-title{font-weight:800;margin-bottom:10px}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid #4a402c;background:#0b0b0b;color:#eee;border-radius:12px;padding:9px 15px;cursor:pointer;font:inherit}.option.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.option.disabled{opacity:.4;cursor:not-allowed}.qty-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px}.qty-control{display:flex;align-items:center;border:1px solid #4a402c;border-radius:12px;overflow:hidden}.qty-control button,.qty-control input{width:42px;height:42px;border:0;background:#0b0b0b;color:#fff;text-align:center;font:inherit}.qty-control button{cursor:pointer;color:var(--gold);font-size:20px}.qty-control input{width:48px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.btn-main,.btn-secondary{height:50px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}.btn-main{background:var(--gold);color:#111;border:1px solid var(--gold)}.btn-secondary{background:#0b0b0b;color:#fff;border:1px solid #4b402b}.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.meta{background:#111;border:1px solid #29251d;border-radius:13px;padding:12px}.meta small{display:block;color:#777;margin-bottom:3px}.meta strong{font-size:13px}.notice{margin-top:15px;color:#aaa;font-size:12px;line-height:1.8}.loading,.empty-product{padding:80px 20px;text-align:center;color:#999}.toast{position:fixed;bottom:25px;right:25px;background:var(--gold);color:#111;padding:12px 17px;border-radius:12px;font-weight:800;z-index:50;display:none}.toast.show{display:block}
/* تحسين عرض صفحة المنتج: بدون فراغات أفقية وعلى كامل عرض الهاتف */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body.product-page{margin:0;min-width:0}
.product-shell{width:min(1400px,calc(100% - 24px));max-width:1400px;margin-inline:auto;padding:24px 0 50px}
.product-layout{width:100%;min-width:0}
.gallery,.info{min-width:0}
@media(max-width:850px){.product-layout{grid-template-columns:1fr;gap:14px}.gallery{position:static;padding:8px;border-radius:0 24px 24px 24px}.info{padding:16px;border-radius:24px 0 24px 24px}.product-shell{width:calc(100% - 16px);padding:10px 0 30px}.main-image{aspect-ratio:.88}.thumbs{gap:7px}.thumb{width:64px;height:76px}.title{font-size:clamp(24px,8vw,34px)}.description{font-size:14px}.actions{grid-template-columns:1fr;gap:8px}.meta-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.price-line{margin:14px 0}.qty-row{margin-top:14px}}
@media(max-width:380px){.product-shell{width:calc(100% - 10px)}.info{padding:13px}.meta-grid{grid-template-columns:1fr}.nesma-modern-navbar{padding-inline:8px}.nesma-modern-navbar .nav-left{gap:6px}.nesma-modern-navbar .logo-text{font-size:33px}}
</style>
</head>

<main class="shop-wrap product-shell"><div id="productRoot" class="loading">جاري تحميل تفاصيل المنتج…</div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="store-atheer.js"></script>
<script>
(async()=>{
 const root=document.getElementById('productRoot'),toast=document.getElementById('toast');
 const id=new URLSearchParams(location.search).get('id');
 const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
 const arr=v=>Array.isArray(v)?v.filter(Boolean):String(v||'').split(/[,،\n]/).map(x=>x.trim()).filter(Boolean);
 const api='https://nesma-store.onrender.com/api/products';
 try{
   const r=await fetch(api,{credentials:'include'}); if(!r.ok)throw new Error(); const data=await r.json(); const p=(data.products||[]).find(x=>String(x.id)===String(id));
   if(!p){root.innerHTML='<div class="empty-product">المنتج غير موجود أو لم يعد منشوراً.</div>';return;}
   const images=[p.image_url,...arr(p.images||p.gallery||p.image_urls)].filter((x,i,a)=>x&&a.indexOf(x)===i);
   const sizes=arr(p.sizes||p.available_sizes),colors=arr(p.colors||p.available_colors),fabrics=arr(p.fabrics||p.fabric||p.available_fabrics),badges=arr(p.badges||p.badge);
   const price=Number(p.price||0),old=Number(p.old_price||0),discount=old>price?Math.round((old-price)/old*100):0;
   root.innerHTML=`<div class="product-layout"><section class="gallery"><div class="main-image"><img id="mainImage" src="${esc(images[0])}" alt="${esc(p.title)}"></div><div class="thumbs" id="thumbs">${images.map((src,i)=>`<button class="thumb ${i===0?'active':''}" data-src="${esc(src)}"><img src="${esc(src)}" alt="صورة ${i+1}"></button>`).join('')}</div></section><section class="info"><span class="kicker">ATHEER EXCLUSIVE</span><h1 class="title">${esc(p.title)}</h1><div class="category">${esc(p.category||'عبايات نسائية')}</div><div class="rating">★★★★★ <span style="color:#777;font-size:12px">(${Number(p.reviews||0)} تقييم)</span></div><p class="description">${esc(p.description||'تفاصيل المنتج تظهر هنا كما تمت إضافتها من لوحة إدارة متجر أثير.')}</p>${badges.length?`<div class="badges">${badges.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>`:''}<div class="price-line"><strong class="price" id="productPrice">${NesmaShop.money(price)}</strong>${old?`<span class="old" id="productOldPrice">${NesmaShop.money(old)}</span>`:''}${discount?`<span class="discount">خصم ${discount}%</span>`:''}</div>${sizes.length?`<div class="option-section"><div class="option-title">المقاس</div><div class="options" id="sizes">${sizes.map((x,i)=>`<button class="option ${i===0?'active':''}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}${colors.length?`<div class="option-section"><div class="option-title">اللون</div><div class="options" id="colors">${colors.map((x,i)=>`<button class="option ${i===0?'active':''}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}${fabrics.length?`<div class="option-section"><div class="option-title">نوع القماش</div><div class="options" id="fabrics">${fabrics.map((x,i)=>`<button class="option ${i===0?'active':''}" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`:''}<div class="qty-row"><strong>الكمية</strong><div class="qty-control"><button id="minus">−</button><input id="qty" type="number" min="1" max="99" value="1"><button id="plus">+</button></div></div><div class="actions"><button class="btn-main" id="add">أضف إلى السلة</button><button class="btn-secondary" id="buy">الذهاب إلى السلة</button></div><div class="meta-grid"><div class="meta"><small>الحالة</small><strong>${p.active===false?'غير متوفر':'متوفر الآن'}</strong></div><div class="meta"><small>وقت التجهيز</small><strong>${Number(p.prep_time||10)} دقيقة</strong></div><div class="meta"><small>القسم</small><strong>${esc(p.category||'عام')}</strong></div><div class="meta"><small>العملة الأساسية</small><strong>ريال يمني</strong></div></div><div class="notice">اختاري المقاس واللون والقماش قبل الإضافة. يتم حفظ الاختيارات مع المنتج داخل السلة.</div></section></div>`;
   document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.getElementById('mainImage').src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
   document.querySelectorAll('.options').forEach(group=>group.querySelectorAll('.option').forEach(b=>b.onclick=()=>{group.querySelectorAll('.option').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));
   const qty=document.getElementById('qty');document.getElementById('minus').onclick=()=>qty.value=Math.max(1,Number(qty.value)-1);document.getElementById('plus').onclick=()=>qty.value=Math.min(99,Number(qty.value)+1);
   const cart=JSON.parse(localStorage.getItem('nesma-cart')||'[]');
   const selected=g=>g?.querySelector('.option.active')?.dataset.value||'';
   const add=()=>{const item={id:p.id,title:p.title,price_yer:Number(p.price||0),price:Number(p.price||0),image:p.image_url,qty:Math.max(1,Math.min(99,Number(qty.value)||1)),size:selected(document.getElementById('sizes')),color:selected(document.getElementById('colors')),fabric:selected(document.getElementById('fabrics'))};const oldItem=cart.find(x=>String(x.id)===String(item.id)&&x.size===item.size&&x.color===item.color&&x.fabric===item.fabric);if(oldItem)oldItem.qty=Math.min(99,oldItem.qty+item.qty);else cart.push(item);localStorage.setItem('nesma-cart',JSON.stringify(cart));toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500);};
   document.getElementById('add').onclick=add;document.getElementById('buy').onclick=()=>{add();location.href='cart.html'};
   document.addEventListener('nesma:currency',()=>{const pp=document.getElementById('productPrice'),op=document.getElementById('productOldPrice');if(pp)pp.textContent=NesmaShop.money(price);if(op)op.textContent=NesmaShop.money(old);});
 }catch(e){root.innerHTML='<div class="empty-product">تعذر تحميل معلومات المنتج حالياً. حاولي مرة أخرى.</div>';}
})();
</script>
<script src="notifications.js"></script></body></html>
